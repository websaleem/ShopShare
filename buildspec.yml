version: 0.2

env:
  variables:
    STACK_NAME: "shopshare-stack"
    BEDROCK_MODEL_ID: "amazon.nova-pro-v1:0"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - yum install -y jq zip

  pre_build:
    commands:
      - echo "Validating Python source..."
      - python3 -m py_compile backend/lambda/extract.py
      - echo "Validation passed."

  build:
    commands:
      # Build Lambda zip — each command runs in its own shell in CodeBuild,
      # so we chain with && to keep the cd in scope.
      - echo "Building Lambda package..."
      - cd backend/lambda && chmod +x build.sh && ./build.sh
      # Deploy CloudFormation stack (creates/updates all resources)
      - echo "Deploying CloudFormation stack..."
      - cd backend/deploy && chmod +x package_and_deploy.sh && ./package_and_deploy.sh $STACK_NAME $BEDROCK_MODEL_ID

  post_build:
    commands:
      # Upload the real Lambda code (the CFN stack starts with a placeholder)
      - echo "Updating Lambda function code..."
      - aws lambda update-function-code --function-name "shopshare-extract-${STACK_NAME}" --zip-file fileb://backend/lambda/lambda.zip
      # Generate config.js from SSM Parameter Store values
      - echo "Generating webpage config.js from SSM..."
      - |
        API_URL=$(aws ssm get-parameter --name /shopshare/api-url --query 'Parameter.Value' --output text)
        POOL_ID=$(aws ssm get-parameter --name /shopshare/cognito-user-pool-id --query 'Parameter.Value' --output text)
        CLIENT_ID=$(aws ssm get-parameter --name /shopshare/cognito-client-id --query 'Parameter.Value' --output text)
        cat > webpage/config.js <<EOF
        const SHOPSHARE_CONFIG = {
            API_BASE_URL: "${API_URL}",
            COGNITO_USER_POOL_ID: "${POOL_ID}",
            COGNITO_CLIENT_ID: "${CLIENT_ID}"
        };
        EOF
      - echo "Deploying webpage to S3..."
      - aws s3 sync webpage/ s3://$WEB_BUCKET_NAME/shopshare/ --exclude "*.DS_Store" --exclude "config.example.js" --cache-control "public, max-age=300"
      - aws s3 cp webpage/index.html s3://$WEB_BUCKET_NAME/shopshare --content-type "text/html" --cache-control "public, max-age=300"
      - aws s3 cp webpage/index.html s3://$WEB_BUCKET_NAME/shopshare/ --content-type "text/html" --cache-control "public, max-age=300"
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DIST_ID --paths "/shopshare/*" "/shopshare"
      - echo "Deployment complete."

artifacts:
  files:
    - backend/lambda/lambda.zip
  discard-paths: yes
