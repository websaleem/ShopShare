version: 0.2

env:
  variables:
    STACK_NAME: "shopshare-stack"
    BEDROCK_MODEL_ID: "amazon.nova-pro-v1:0"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing dependencies..."
      - yum install -y jq zip

  pre_build:
    commands:
      - echo "Validating Python source..."
      - python3 -m py_compile backend/lambda/extract.py
      - echo "Validation passed."
      - echo "Detecting branch and configuring deployment environment..."
      - |
        if [ "$CODEBUILD_SOURCE_VERSION" = "main" ] || [ "$CODEBUILD_SOURCE_VERSION" = "refs/heads/main" ]; then
          echo "=== Configuring for PRODUCTION (main branch) ==="
          echo "export SSM_PREFIX=/shopshare/prod" > .env.deploy
          echo "export TARGET_BUCKET=shopshare.websaleem.com" >> .env.deploy
          echo "export STACK_NAME_RESOLVED=${STACK_NAME}" >> .env.deploy
          echo "export CF_DIST_ID=\$(aws ssm get-parameter --name /shopshare/prod/cloudfront-dist-id --query 'Parameter.Value' --output text 2>/dev/null || echo \"\$CLOUDFRONT_DIST_ID\")" >> .env.deploy
        else
          echo "=== Configuring for DEVELOPMENT (dev branch) ==="
          echo "export SSM_PREFIX=/shopshare/dev" > .env.deploy
          echo "export TARGET_BUCKET=dev.shopshare.websaleem.com" >> .env.deploy
          echo "export STACK_NAME_RESOLVED=${STACK_NAME}-dev" >> .env.deploy
          echo "export CF_DIST_ID=\$(aws ssm get-parameter --name /shopshare/dev/cloudfront-dist-id --query 'Parameter.Value' --output text 2>/dev/null || echo \"\$CLOUDFRONT_DIST_ID\")" >> .env.deploy
        fi
        cat .env.deploy

  build:
    commands:
      # Build Lambda zip — each command runs in its own shell in CodeBuild,
      # so we chain with && to keep the cd in scope.
      - echo "Building Lambda package..."
      - cd backend/lambda && chmod +x build.sh && ./build.sh
      # Deploy CloudFormation stack (creates/updates all resources)
      - source .env.deploy && echo "Deploying CloudFormation stack ($STACK_NAME_RESOLVED)..."
      - source .env.deploy && cd backend/deploy && chmod +x package_and_deploy.sh && ./package_and_deploy.sh $STACK_NAME_RESOLVED $BEDROCK_MODEL_ID

  post_build:
    commands:
      # Upload the real Lambda code (the CFN stack starts with a placeholder)
      - source .env.deploy && echo "Updating Lambda function code ($STACK_NAME_RESOLVED)..."
      - source .env.deploy && aws lambda update-function-code --function-name "shopshare-extract-${STACK_NAME_RESOLVED}" --zip-file fileb://backend/lambda/lambda.zip
      # Generate config.js from SSM Parameter Store values
      - source .env.deploy && echo "Generating website config.js from SSM ($SSM_PREFIX)..."
      - |
        source .env.deploy
        API_URL=$(aws ssm get-parameter --name ${SSM_PREFIX}/api-url --query 'Parameter.Value' --output text 2>/dev/null || aws ssm get-parameter --name /shopshare/api-url --query 'Parameter.Value' --output text)
        POOL_ID=$(aws ssm get-parameter --name ${SSM_PREFIX}/cognito-user-pool-id --query 'Parameter.Value' --output text 2>/dev/null || aws ssm get-parameter --name /shopshare/cognito-user-pool-id --query 'Parameter.Value' --output text)
        CLIENT_ID=$(aws ssm get-parameter --name ${SSM_PREFIX}/cognito-client-id --query 'Parameter.Value' --output text 2>/dev/null || aws ssm get-parameter --name /shopshare/cognito-client-id --query 'Parameter.Value' --output text)
        cat > website/config.js <<EOF
        const SHOPSHARE_CONFIG = {
            API_BASE_URL: "${API_URL}",
            COGNITO_USER_POOL_ID: "${POOL_ID}",
            COGNITO_CLIENT_ID: "${CLIENT_ID}"
        };
        EOF
      - source .env.deploy && echo "Deploying website to S3 ($TARGET_BUCKET)..."
      - source .env.deploy && aws s3 sync website/ s3://$TARGET_BUCKET/ --exclude "*.DS_Store" --exclude "config.example.js" --cache-control "public, max-age=300"
      - source .env.deploy && aws s3 cp website/index.html s3://$TARGET_BUCKET/ --content-type "text/html" --cache-control "public, max-age=300"
      - source .env.deploy && if [ -n "$CF_DIST_ID" ] && [ "$CF_DIST_ID" != "None" ] && [ "$CF_DIST_ID" != "" ]; then aws cloudfront create-invalidation --distribution-id $CF_DIST_ID --paths "/*" "/"; fi
      - echo "Deployment complete."

artifacts:
  files:
    - backend/lambda/lambda.zip
  discard-paths: yes
